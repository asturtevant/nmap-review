name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No install step and no nmap on the runner: the parser and the review
      # rules are exercised entirely against committed XML, which is the whole
      # reason the tool is split that way.
      - run: make check
